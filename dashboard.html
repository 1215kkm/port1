<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - Portfolio Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .dashboard-header {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .dashboard-logo span {
            font-size: 1.5rem;
        }

        .dashboard-nav {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .user-name {
            font-size: 0.95rem;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .btn-danger:hover {
            background: rgba(231, 76, 60, 0.3);
        }

        .dashboard-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 48px;
        }

        .welcome-title {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .welcome-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
        }

        .action-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 48px;
        }

        .action-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .action-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-4px);
        }

        .action-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .action-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .action-desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .portfolio-url-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
        }

        .url-title {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.8);
        }

        .url-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 12px 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .url-text {
            flex: 1;
            font-family: monospace;
            font-size: 0.95rem;
            color: #3498db;
            word-break: break-all;
        }

        .btn-copy {
            padding: 8px 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: #2980b9;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading-screen">
        <div class="loading-spinner"></div>
    </div>

    <header class="dashboard-header">
        <div class="dashboard-logo">
            <span>📁</span>
            Portfolio Platform
        </div>
        <nav class="dashboard-nav">
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">?</div>
                <span class="user-name" id="user-name">로딩중...</span>
            </div>
            <button class="btn btn-danger" id="logout-btn">로그아웃</button>
        </nav>
    </header>

    <main class="dashboard-content">
        <section class="welcome-section">
            <h1 class="welcome-title">안녕하세요, <span id="welcome-name">사용자</span>님! 👋</h1>
            <p class="welcome-subtitle">포트폴리오를 관리하고 공유하세요</p>
        </section>

        <div class="action-cards">
            <a href="admin.html" class="action-card">
                <div class="action-icon">✏️</div>
                <h2 class="action-title">포트폴리오 편집</h2>
                <p class="action-desc">프로필, 작품, 경력 등<br>포트폴리오 내용을 수정합니다</p>
            </a>

            <a href="#" class="action-card" id="preview-card">
                <div class="action-icon">👁️</div>
                <h2 class="action-title">포트폴리오 미리보기</h2>
                <p class="action-desc">다른 사람들에게 보이는<br>내 포트폴리오를 확인합니다</p>
            </a>

            <a href="#" class="action-card" id="intro-card">
                <div class="action-icon">🏠</div>
                <h2 class="action-title">인트로 페이지</h2>
                <p class="action-desc">포트폴리오 진입점이 되는<br>인트로 페이지를 확인합니다</p>
            </a>
        </div>

        <section class="portfolio-url-section">
            <h3 class="url-title">📎 내 포트폴리오 공유 URL</h3>
            <div class="url-box">
                <span class="url-text" id="portfolio-url">로딩중...</span>
                <button class="btn-copy" id="copy-url-btn">복사</button>
            </div>
        </section>
    </main>

    <script type="module">
        import { AuthManager, FirestoreManager } from './js/firebase-config.js';

        // Initialize
        async function init() {
            await AuthManager.init();

            // Check if logged in
            if (!AuthManager.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }

            const user = AuthManager.getUser();
            const userProfile = await FirestoreManager.getUserProfile(user.uid);

            // Update UI
            document.getElementById('loading-screen').classList.add('hidden');

            const displayName = userProfile?.displayName || user.email?.split('@')[0] || '사용자';
            document.getElementById('user-name').textContent = displayName;
            document.getElementById('welcome-name').textContent = displayName;
            document.getElementById('user-avatar').textContent = displayName.charAt(0).toUpperCase();

            // Portfolio URL
            const portfolioId = userProfile?.portfolioId || user.uid;
            const baseUrl = window.location.origin + window.location.pathname.replace('dashboard.html', '');
            const portfolioUrl = `${baseUrl}portfolio.html?u=${portfolioId}`;
            const introUrl = `${baseUrl}intro.html?u=${portfolioId}`;

            document.getElementById('portfolio-url').textContent = portfolioUrl;

            // Set up card links
            document.getElementById('preview-card').href = portfolioUrl;
            document.getElementById('intro-card').href = introUrl;

            // Copy URL button
            document.getElementById('copy-url-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(portfolioUrl).then(() => {
                    const btn = document.getElementById('copy-url-btn');
                    btn.textContent = '복사됨!';
                    setTimeout(() => {
                        btn.textContent = '복사';
                    }, 2000);
                });
            });

            // Logout
            document.getElementById('logout-btn').addEventListener('click', async () => {
                await AuthManager.signOut();
                window.location.href = 'login.html';
            });
        }

        init();
    </script>
</body>
</html>
