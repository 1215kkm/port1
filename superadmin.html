<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈퍼관리자 - 대시보드</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
        }

        .super-admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .super-admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }

        .super-admin-header h1 {
            font-size: 24px;
            color: #fff;
        }

        .super-admin-header .back-btn {
            padding: 8px 16px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        .super-admin-header .back-btn:hover {
            background: #444;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .stat-card-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .stat-card-value {
            font-size: 32px;
            font-weight: 700;
            color: #3498db;
        }

        .stat-card-sub {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
        }

        .stat-card.highlight .stat-card-value {
            color: #27ae60;
        }

        .stat-card.warning .stat-card-value {
            color: #f39c12;
        }

        /* Section */
        .dashboard-section {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #333;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
        }

        .section-action {
            padding: 6px 12px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Member Table */
        .member-table {
            width: 100%;
            border-collapse: collapse;
        }

        .member-table th,
        .member-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        .member-table th {
            background: #16213e;
            font-size: 12px;
            color: #888;
            font-weight: 500;
            text-transform: uppercase;
        }

        .member-table tr:hover {
            background: rgba(52, 152, 219, 0.1);
        }

        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .member-name {
            font-weight: 500;
        }

        .member-email {
            font-size: 12px;
            color: #888;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .status-badge.active,
        .status-badge.status-success {
            background: rgba(39, 174, 96, 0.2);
            color: #27ae60;
        }

        .status-badge.status-info {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
        }

        .status-badge.status-expired {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .status-badge.status-warning {
            background: rgba(241, 196, 15, 0.2);
            color: #f1c40f;
        }

        .status-badge.inactive {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .preview-btn {
            padding: 4px 8px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .preview-btn:hover {
            background: #3498db;
        }

        /* Preview Modal */
        .preview-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            padding: 20px;
        }

        .preview-modal.active {
            display: flex;
            flex-direction: column;
        }

        .preview-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #1a1a2e;
            border-radius: 8px 8px 0 0;
        }

        .preview-modal-title {
            font-size: 14px;
        }

        .preview-modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        .preview-modal-frame {
            flex: 1;
            background: #fff;
            border-radius: 0 0 8px 8px;
            overflow: hidden;
        }

        .preview-modal-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Activity Log */
        .activity-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .activity-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }

        .activity-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .activity-content {
            flex: 1;
        }

        .activity-text {
            font-size: 13px;
        }

        .activity-time {
            font-size: 11px;
            color: #666;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Access Denied */
        .access-denied {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .access-denied h1 {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .access-denied p {
            color: #888;
            margin-bottom: 24px;
        }

        /* Chart placeholder */
        .chart-placeholder {
            height: 200px;
            background: #16213e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>인증 확인 중...</p>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="preview-modal" id="preview-modal">
        <div class="preview-modal-header">
            <span class="preview-modal-title" id="preview-modal-title">미리보기</span>
            <button class="preview-modal-close" onclick="closePreview()">&times;</button>
        </div>
        <div class="preview-modal-frame">
            <iframe id="preview-frame" src=""></iframe>
        </div>
    </div>

    <script type="module">
        import { AuthManager, FirestoreManager } from './js/firebase-config.js';
        import { collection, getDocs, query, where, orderBy, limit, doc, getDoc, setDoc, updateDoc, increment } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { db } from './js/firebase-config.js';

        // Super Admin Email (change this to your email)
        const SUPER_ADMIN_EMAILS = ['1215kkm@naver.com', 'admin@example.com'];

        let currentUser = null;

        async function init() {
            await AuthManager.init();

            if (!AuthManager.isLoggedIn()) {
                showAccessDenied('로그인이 필요합니다.');
                return;
            }

            currentUser = AuthManager.getUser();

            // Check if user is super admin
            if (!SUPER_ADMIN_EMAILS.includes(currentUser.email)) {
                showAccessDenied('접근 권한이 없습니다.');
                return;
            }

            // Load dashboard
            renderDashboard();
            loadStats();
            loadMembers();
            loadRecentActivity();
        }

        function showAccessDenied(message) {
            document.getElementById('app-container').innerHTML = `
                <div class="access-denied">
                    <h1>🚫</h1>
                    <p>${message}</p>
                    <a href="admin.html" class="back-btn" style="padding: 12px 24px; background: #3498db; color: #fff; text-decoration: none; border-radius: 8px;">관리자 페이지로 돌아가기</a>
                </div>
            `;
        }

        function renderDashboard() {
            document.getElementById('app-container').innerHTML = `
                <div class="super-admin-container">
                    <header class="super-admin-header">
                        <h1>🔐 슈퍼관리자 대시보드</h1>
                        <a href="admin.html" class="back-btn">← 관리자 페이지</a>
                    </header>

                    <!-- Stats Cards -->
                    <div class="stats-grid">
                        <div class="stat-card highlight">
                            <div class="stat-card-label">오늘 방문자</div>
                            <div class="stat-card-value" id="stat-today">-</div>
                            <div class="stat-card-sub">전일 대비 <span id="stat-today-diff">-</span></div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">어제 방문자</div>
                            <div class="stat-card-value" id="stat-yesterday">-</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">이번 주 방문</div>
                            <div class="stat-card-value" id="stat-week">-</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">이번 달 방문</div>
                            <div class="stat-card-value" id="stat-month">-</div>
                        </div>
                        <div class="stat-card warning">
                            <div class="stat-card-label">PDF 다운로드</div>
                            <div class="stat-card-value" id="stat-pdf">-</div>
                            <div class="stat-card-sub">전체 누적</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">총 회원 수</div>
                            <div class="stat-card-value" id="stat-members">-</div>
                        </div>
                    </div>

                    <!-- Coupon Management -->
                    <div class="dashboard-section">
                        <div class="section-header">
                            <h2 class="section-title">🎟️ 쿠폰 관리</h2>
                            <button class="section-action" onclick="showCreateCouponModal()">+ 쿠폰 생성</button>
                        </div>
                        <div id="coupon-list">
                            <div class="loading">
                                <div class="loading-spinner"></div>
                                <p>쿠폰 목록 로딩 중...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Member List -->
                    <div class="dashboard-section">
                        <div class="section-header">
                            <h2 class="section-title">👥 회원 목록</h2>
                            <button class="section-action" onclick="refreshMembers()">새로고침</button>
                        </div>
                        <div id="member-list">
                            <div class="loading">
                                <div class="loading-spinner"></div>
                                <p>회원 목록 로딩 중...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Activity -->
                    <div class="dashboard-section">
                        <div class="section-header">
                            <h2 class="section-title">📊 최근 활동</h2>
                        </div>
                        <div id="activity-list" class="activity-list">
                            <div class="loading">
                                <div class="loading-spinner"></div>
                                <p>활동 로그 로딩 중...</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadStats() {
            try {
                // Get analytics document
                const analyticsRef = doc(db, 'analytics', 'global');
                const analyticsSnap = await getDoc(analyticsRef);

                const today = new Date().toISOString().split('T')[0];
                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

                let stats = {
                    today: 0,
                    yesterday: 0,
                    week: 0,
                    month: 0,
                    pdfDownloads: 0,
                    totalMembers: 0
                };

                if (analyticsSnap.exists()) {
                    const data = analyticsSnap.data();
                    stats.today = data.visits?.[today] || 0;
                    stats.yesterday = data.visits?.[yesterday] || 0;
                    stats.pdfDownloads = data.pdfDownloads || 0;

                    // Calculate week and month
                    const visits = data.visits || {};
                    const now = new Date();
                    const weekAgo = new Date(now - 7 * 86400000);
                    const monthAgo = new Date(now - 30 * 86400000);

                    Object.entries(visits).forEach(([date, count]) => {
                        const d = new Date(date);
                        if (d >= weekAgo) stats.week += count;
                        if (d >= monthAgo) stats.month += count;
                    });
                }

                // Get member count
                const usersSnap = await getDocs(collection(db, 'users'));
                stats.totalMembers = usersSnap.size;

                // Update UI
                document.getElementById('stat-today').textContent = stats.today;
                document.getElementById('stat-yesterday').textContent = stats.yesterday;
                document.getElementById('stat-week').textContent = stats.week;
                document.getElementById('stat-month').textContent = stats.month;
                document.getElementById('stat-pdf').textContent = stats.pdfDownloads;
                document.getElementById('stat-members').textContent = stats.totalMembers;

                // Calculate diff
                const diff = stats.today - stats.yesterday;
                const diffEl = document.getElementById('stat-today-diff');
                if (diff > 0) {
                    diffEl.textContent = `+${diff}`;
                    diffEl.style.color = '#27ae60';
                } else if (diff < 0) {
                    diffEl.textContent = `${diff}`;
                    diffEl.style.color = '#e74c3c';
                } else {
                    diffEl.textContent = '0';
                    diffEl.style.color = '#888';
                }

            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadMembers() {
            try {
                const usersSnap = await getDocs(collection(db, 'users'));
                const members = [];

                for (const userDoc of usersSnap.docs) {
                    const userData = userDoc.data();

                    // Get portfolio data for last edit time
                    const portfolioSnap = await getDoc(doc(db, 'portfolios', userDoc.id));
                    const portfolioData = portfolioSnap.exists() ? portfolioSnap.data() : null;

                    members.push({
                        id: userDoc.id,
                        email: userData.email || '-',
                        name: userData.displayName || portfolioData?.profile?.name || '이름 없음',
                        createdAt: userData.createdAt || null,
                        lastLogin: userData.lastLogin || null,
                        updatedAt: portfolioData?.updatedAt || null,
                        portfolioId: userData.portfolioId || userDoc.id
                    });
                }

                // Sort by last login
                members.sort((a, b) => {
                    if (!a.lastLogin) return 1;
                    if (!b.lastLogin) return -1;
                    return new Date(b.lastLogin) - new Date(a.lastLogin);
                });

                renderMemberTable(members);

            } catch (error) {
                console.error('Error loading members:', error);
                document.getElementById('member-list').innerHTML = '<p style="color: #e74c3c;">회원 목록을 불러오는데 실패했습니다.</p>';
            }
        }

        function renderMemberTable(members) {
            if (members.length === 0) {
                document.getElementById('member-list').innerHTML = '<p style="color: #888;">등록된 회원이 없습니다.</p>';
                return;
            }

            const html = `
                <table class="member-table">
                    <thead>
                        <tr>
                            <th>회원</th>
                            <th>이메일</th>
                            <th>가입일</th>
                            <th>최근 접속</th>
                            <th>마지막 수정</th>
                            <th>액션</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${members.map(m => `
                            <tr>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 10px;">
                                        <div class="member-avatar">${m.name.charAt(0)}</div>
                                        <span class="member-name">${m.name}</span>
                                    </div>
                                </td>
                                <td class="member-email">${m.email}</td>
                                <td>${formatDate(m.createdAt)}</td>
                                <td>${formatDate(m.lastLogin)}</td>
                                <td>${formatDate(m.updatedAt)}</td>
                                <td>
                                    <button class="preview-btn" onclick="openPreview('${m.portfolioId}', '${m.name}')">미리보기</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('member-list').innerHTML = html;
        }

        async function loadRecentActivity() {
            try {
                const activityRef = collection(db, 'activity_logs');
                const q = query(activityRef, orderBy('timestamp', 'desc'), limit(20));
                const activitySnap = await getDocs(q);

                const activities = [];
                activitySnap.forEach(doc => {
                    activities.push({ id: doc.id, ...doc.data() });
                });

                renderActivityList(activities);

            } catch (error) {
                console.error('Error loading activity:', error);
                document.getElementById('activity-list').innerHTML = '<p style="color: #888;">활동 로그가 없습니다.</p>';
            }
        }

        function renderActivityList(activities) {
            if (activities.length === 0) {
                document.getElementById('activity-list').innerHTML = '<p style="color: #888;">최근 활동이 없습니다.</p>';
                return;
            }

            const icons = {
                'visit': '👁️',
                'login': '🔐',
                'save': '💾',
                'pdf': '📄',
                'signup': '✨'
            };

            const html = activities.map(a => `
                <div class="activity-item">
                    <div class="activity-icon">${icons[a.type] || '📌'}</div>
                    <div class="activity-content">
                        <div class="activity-text">${a.message || a.type}</div>
                        <div class="activity-time">${formatDateTime(a.timestamp)}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('activity-list').innerHTML = html;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Make functions globally available
        window.openPreview = function(portfolioId, name) {
            const modal = document.getElementById('preview-modal');
            const frame = document.getElementById('preview-frame');
            const title = document.getElementById('preview-modal-title');

            title.textContent = `${name}님의 포트폴리오 미리보기`;
            frame.src = `portfolio.html?u=${portfolioId}`;
            modal.classList.add('active');
        };

        window.closePreview = function() {
            const modal = document.getElementById('preview-modal');
            const frame = document.getElementById('preview-frame');
            modal.classList.remove('active');
            frame.src = '';
        };

        window.refreshMembers = function() {
            document.getElementById('member-list').innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>회원 목록 로딩 중...</p>
                </div>
            `;
            loadMembers();
        };

        // ========== Coupon Management Functions ==========

        async function loadCoupons() {
            try {
                const { CouponManager } = await import('./js/firebase-config.js');
                const coupons = await CouponManager.getAllCoupons();
                renderCouponList(coupons);
            } catch (error) {
                console.error('Error loading coupons:', error);
                document.getElementById('coupon-list').innerHTML = '<p style="color: #e74c3c;">쿠폰 목록을 불러오는데 실패했습니다.</p>';
            }
        }

        function renderCouponList(coupons) {
            if (coupons.length === 0) {
                document.getElementById('coupon-list').innerHTML = '<p style="color: #888;">생성된 쿠폰이 없습니다.</p>';
                return;
            }

            const html = `
                <table class="member-table">
                    <thead>
                        <tr>
                            <th>쿠폰 코드</th>
                            <th>기간</th>
                            <th>유형</th>
                            <th>사용</th>
                            <th>생성일</th>
                            <th>상태</th>
                            <th>액션</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${coupons.map(c => `
                            <tr style="${!c.active ? 'opacity: 0.5;' : ''}">
                                <td>
                                    <code style="background: #16213e; padding: 4px 8px; border-radius: 4px; font-size: 14px; cursor: pointer;" onclick="copyCouponCode('${c.code}')">${c.code}</code>
                                </td>
                                <td><span style="color: #3498db; font-weight: 600;">${c.months}개월</span></td>
                                <td>
                                    <span class="status-badge ${c.type === 'single' ? 'status-info' : 'status-success'}">${c.type === 'single' ? '1인용' : '다인용'}</span>
                                </td>
                                <td>${c.usedCount}${c.maxUses ? '/' + c.maxUses : ''}</td>
                                <td>${formatDate(c.createdAt)}</td>
                                <td>
                                    <span class="status-badge ${c.active ? 'status-success' : 'status-expired'}">${c.active ? '활성' : '비활성'}</span>
                                </td>
                                <td>
                                    ${c.active ? `<button class="preview-btn" style="background: #e74c3c;" onclick="deactivateCoupon('${c.code}')">비활성화</button>` : ''}
                                    <button class="preview-btn" style="background: #333;" onclick="deleteCoupon('${c.code}')">삭제</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('coupon-list').innerHTML = html;
        }

        window.showCreateCouponModal = function() {
            const modal = document.getElementById('preview-modal');
            const title = document.getElementById('preview-modal-title');

            title.textContent = '새 쿠폰 생성';

            document.querySelector('.preview-modal-frame').innerHTML = `
                <div style="padding: 30px; background: #1a1a2e; height: 100%; color: #fff;">
                    <div style="max-width: 400px; margin: 0 auto;">
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; margin-bottom: 8px; color: #888;">기간 선택</label>
                            <select id="coupon-months" style="width: 100%; padding: 12px; background: #16213e; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 16px;">
                                <option value="1">1개월</option>
                                <option value="2">2개월</option>
                                <option value="3" selected>3개월</option>
                                <option value="6">6개월</option>
                                <option value="12">12개월</option>
                            </select>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; margin-bottom: 8px; color: #888;">쿠폰 유형</label>
                            <select id="coupon-type" style="width: 100%; padding: 12px; background: #16213e; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 16px;" onchange="toggleMaxUses()">
                                <option value="single">1인용 (1회 사용)</option>
                                <option value="multi">다인용 (여러 명 사용 가능)</option>
                            </select>
                        </div>
                        <div id="max-uses-group" style="margin-bottom: 20px; display: none;">
                            <label style="display: block; margin-bottom: 8px; color: #888;">최대 사용 횟수 (빈칸 = 무제한)</label>
                            <input type="number" id="coupon-max-uses" min="1" placeholder="무제한" style="width: 100%; padding: 12px; background: #16213e; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 16px;">
                        </div>
                        <button onclick="createCoupon()" style="width: 100%; padding: 14px; background: #3498db; border: none; border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer; font-weight: 600;">쿠폰 생성</button>
                        <button onclick="closePreview()" style="width: 100%; padding: 14px; background: #333; border: none; border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer; margin-top: 10px;">취소</button>
                    </div>
                </div>
            `;

            modal.classList.add('active');
        };

        window.toggleMaxUses = function() {
            const type = document.getElementById('coupon-type').value;
            const group = document.getElementById('max-uses-group');
            group.style.display = type === 'multi' ? 'block' : 'none';
        };

        window.createCoupon = async function() {
            try {
                // 폼 요소 확인
                const monthsEl = document.getElementById('coupon-months');
                const typeEl = document.getElementById('coupon-type');
                const maxUsesInput = document.getElementById('coupon-max-uses');

                if (!monthsEl || !typeEl) {
                    alert('쿠폰 생성 폼을 찾을 수 없습니다. 다시 시도해주세요.');
                    return;
                }

                const months = parseInt(monthsEl.value);
                const type = typeEl.value;
                const maxUses = maxUsesInput && maxUsesInput.value ? parseInt(maxUsesInput.value) : null;

                // 유효성 검사
                if (isNaN(months) || months < 1) {
                    alert('유효한 기간을 선택해주세요.');
                    return;
                }

                if (!currentUser || !currentUser.uid) {
                    alert('로그인 정보를 확인할 수 없습니다. 페이지를 새로고침해주세요.');
                    return;
                }

                console.log('Creating coupon:', { months, type, maxUses, createdBy: currentUser.uid });

                const { CouponManager } = await import('./js/firebase-config.js');
                const result = await CouponManager.createCoupon({
                    months,
                    type,
                    maxUses,
                    createdBy: currentUser.uid
                });

                if (result.success) {
                    alert(`쿠폰이 생성되었습니다!\n\n코드: ${result.coupon.code}\n기간: ${months}개월\n유형: ${type === 'single' ? '1인용' : '다인용'}`);
                    closePreview();

                    // Restore iframe in modal
                    document.querySelector('.preview-modal-frame').innerHTML = '<iframe id="preview-frame" src=""></iframe>';

                    loadCoupons();
                } else {
                    alert('쿠폰 생성 실패: ' + (result.error || '알 수 없는 오류'));
                }
            } catch (error) {
                console.error('Error creating coupon:', error);
                alert('쿠폰 생성 중 오류가 발생했습니다: ' + error.message);
            }
        };

        window.copyCouponCode = function(code) {
            navigator.clipboard.writeText(code).then(() => {
                alert('쿠폰 코드가 복사되었습니다: ' + code);
            });
        };

        window.deactivateCoupon = async function(code) {
            if (!confirm(`쿠폰 "${code}"를 비활성화하시겠습니까?`)) return;

            try {
                const { CouponManager } = await import('./js/firebase-config.js');
                const result = await CouponManager.deactivateCoupon(code);
                if (result.success) {
                    loadCoupons();
                } else {
                    alert('비활성화 실패: ' + result.error);
                }
            } catch (error) {
                console.error('Error deactivating coupon:', error);
            }
        };

        window.deleteCoupon = async function(code) {
            if (!confirm(`쿠폰 "${code}"를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.`)) return;

            try {
                const { CouponManager } = await import('./js/firebase-config.js');
                const result = await CouponManager.deleteCoupon(code);
                if (result.success) {
                    loadCoupons();
                } else {
                    alert('삭제 실패: ' + result.error);
                }
            } catch (error) {
                console.error('Error deleting coupon:', error);
            }
        };

        // Initialize
        init();

        // Load coupons after init
        setTimeout(() => {
            if (document.getElementById('coupon-list')) {
                loadCoupons();
            }
        }, 500);
    </script>
</body>
</html>
