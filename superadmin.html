<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈퍼관리자 - 대시보드</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
        }

        .super-admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .super-admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }

        .super-admin-header h1 {
            font-size: 24px;
            color: #fff;
        }

        .super-admin-header .back-btn {
            padding: 8px 16px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        .super-admin-header .back-btn:hover {
            background: #444;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .stat-card-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .stat-card-value {
            font-size: 32px;
            font-weight: 700;
            color: #3498db;
        }

        .stat-card-sub {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
        }

        .stat-card.highlight .stat-card-value {
            color: #27ae60;
        }

        .stat-card.warning .stat-card-value {
            color: #f39c12;
        }

        /* Section */
        .dashboard-section {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #333;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
        }

        .section-action {
            padding: 6px 12px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Member Table */
        .member-table {
            width: 100%;
            border-collapse: collapse;
        }

        .member-table th,
        .member-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        .member-table th {
            background: #16213e;
            font-size: 12px;
            color: #888;
            font-weight: 500;
            text-transform: uppercase;
        }

        .member-table tr:hover {
            background: rgba(52, 152, 219, 0.1);
        }

        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .member-name {
            font-weight: 500;
        }

        .member-email {
            font-size: 12px;
            color: #888;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .status-badge.active {
            background: rgba(39, 174, 96, 0.2);
            color: #27ae60;
        }

        .status-badge.inactive {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .preview-btn {
            padding: 4px 8px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .preview-btn:hover {
            background: #3498db;
        }

        .edit-btn {
            padding: 4px 8px;
            margin-left: 6px;
            background: #27ae60;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .edit-btn:hover {
            background: #2ecc71;
        }

        /* Preview Modal */
        .preview-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            padding: 20px;
        }

        .preview-modal.active {
            display: flex;
            flex-direction: column;
        }

        .preview-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #1a1a2e;
            border-radius: 8px 8px 0 0;
        }

        .preview-modal-title {
            font-size: 14px;
        }

        .preview-modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        .preview-modal-frame {
            flex: 1;
            background: #fff;
            border-radius: 0 0 8px 8px;
            overflow: hidden;
        }

        .preview-modal-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Activity Log */
        .activity-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .activity-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }

        .activity-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .activity-content {
            flex: 1;
        }

        .activity-text {
            font-size: 13px;
        }

        .activity-time {
            font-size: 11px;
            color: #666;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Access Denied */
        .access-denied {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .access-denied h1 {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .access-denied p {
            color: #888;
            margin-bottom: 24px;
        }

        /* Chart placeholder */
        .chart-placeholder {
            height: 200px;
            background: #16213e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>인증 확인 중...</p>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="preview-modal" id="preview-modal">
        <div class="preview-modal-header">
            <span class="preview-modal-title" id="preview-modal-title">미리보기</span>
            <div style="display:flex; align-items:center; gap:12px;">
                <button class="edit-btn" onclick="openEditFromPreview()" style="padding:6px 14px; font-size:13px;">✏️ 이 포트폴리오 편집하기</button>
                <button class="preview-modal-close" onclick="closePreview()">&times;</button>
            </div>
        </div>
        <div class="preview-modal-frame">
            <iframe id="preview-frame" src=""></iframe>
        </div>
    </div>

    <script type="module">
        import { AuthManager, FirestoreManager } from './js/firebase-config.js';
        import { collection, getDocs, query, where, orderBy, limit, doc, getDoc, setDoc, updateDoc, deleteDoc, increment } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { db } from './js/firebase-config.js';

        // Super Admin Email (change this to your email)
        const SUPER_ADMIN_EMAILS = ['1215kkm@naver.com', 'admin@example.com'];

        let currentUser = null;

        async function init() {
            await AuthManager.init();

            if (!AuthManager.isLoggedIn()) {
                showAccessDenied('로그인이 필요합니다.');
                return;
            }

            currentUser = AuthManager.getUser();

            // Check if user is super admin
            if (!SUPER_ADMIN_EMAILS.includes(currentUser.email)) {
                showAccessDenied('접근 권한이 없습니다.');
                return;
            }

            // Load dashboard
            renderDashboard();
            loadStats();
            loadMembers();
            loadRecentActivity();
        }

        function showAccessDenied(message) {
            document.getElementById('app-container').innerHTML = `
                <div class="access-denied">
                    <h1>🚫</h1>
                    <p>${message}</p>
                    <a href="admin.html" class="back-btn" style="padding: 12px 24px; background: #3498db; color: #fff; text-decoration: none; border-radius: 8px;">관리자 페이지로 돌아가기</a>
                </div>
            `;
        }

        function renderDashboard() {
            document.getElementById('app-container').innerHTML = `
                <div class="super-admin-container">
                    <header class="super-admin-header">
                        <h1>🔐 슈퍼관리자 대시보드</h1>
                        <a href="admin.html" class="back-btn">← 관리자 페이지</a>
                    </header>

                    <!-- Stats Cards -->
                    <div class="stats-grid">
                        <div class="stat-card highlight">
                            <div class="stat-card-label">오늘 방문자</div>
                            <div class="stat-card-value" id="stat-today">-</div>
                            <div class="stat-card-sub">전일 대비 <span id="stat-today-diff">-</span></div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">어제 방문자</div>
                            <div class="stat-card-value" id="stat-yesterday">-</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">이번 주 방문</div>
                            <div class="stat-card-value" id="stat-week">-</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">이번 달 방문</div>
                            <div class="stat-card-value" id="stat-month">-</div>
                        </div>
                        <div class="stat-card warning">
                            <div class="stat-card-label">PDF 다운로드</div>
                            <div class="stat-card-value" id="stat-pdf">-</div>
                            <div class="stat-card-sub">전체 누적</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">총 회원 수</div>
                            <div class="stat-card-value" id="stat-members">-</div>
                        </div>
                    </div>

                    <!-- Member List -->
                    <div class="dashboard-section">
                        <div class="section-header">
                            <h2 class="section-title">👥 회원 목록</h2>
                            <div style="display:flex; gap:8px;">
                                <button class="section-action" style="background:#555;" onclick="backupAll(this)">💾 백업 다운로드</button>
                                <button class="section-action" style="background:#e74c3c;" onclick="deleteSelected()">🗑 선택 삭제 (<span id="sel-count">0</span>)</button>
                                <button class="section-action" onclick="refreshMembers()">새로고침</button>
                            </div>
                        </div>
                        <div id="member-list">
                            <div class="loading">
                                <div class="loading-spinner"></div>
                                <p>회원 목록 로딩 중...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Activity -->
                    <div class="dashboard-section">
                        <div class="section-header">
                            <h2 class="section-title">📊 최근 활동</h2>
                        </div>
                        <div id="activity-list" class="activity-list">
                            <div class="loading">
                                <div class="loading-spinner"></div>
                                <p>활동 로그 로딩 중...</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadStats() {
            try {
                // Get analytics document
                const analyticsRef = doc(db, 'analytics', 'global');
                const analyticsSnap = await getDoc(analyticsRef);

                const today = new Date().toISOString().split('T')[0];
                const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

                let stats = {
                    today: 0,
                    yesterday: 0,
                    week: 0,
                    month: 0,
                    pdfDownloads: 0,
                    totalMembers: 0
                };

                if (analyticsSnap.exists()) {
                    const data = analyticsSnap.data();
                    stats.today = data.visits?.[today] || 0;
                    stats.yesterday = data.visits?.[yesterday] || 0;
                    stats.pdfDownloads = data.pdfDownloads || 0;

                    // Calculate week and month
                    const visits = data.visits || {};
                    const now = new Date();
                    const weekAgo = new Date(now - 7 * 86400000);
                    const monthAgo = new Date(now - 30 * 86400000);

                    Object.entries(visits).forEach(([date, count]) => {
                        const d = new Date(date);
                        if (d >= weekAgo) stats.week += count;
                        if (d >= monthAgo) stats.month += count;
                    });
                }

                // Get member count
                const usersSnap = await getDocs(collection(db, 'users'));
                stats.totalMembers = usersSnap.size;

                // Update UI
                document.getElementById('stat-today').textContent = stats.today;
                document.getElementById('stat-yesterday').textContent = stats.yesterday;
                document.getElementById('stat-week').textContent = stats.week;
                document.getElementById('stat-month').textContent = stats.month;
                document.getElementById('stat-pdf').textContent = stats.pdfDownloads;
                document.getElementById('stat-members').textContent = stats.totalMembers;

                // Calculate diff
                const diff = stats.today - stats.yesterday;
                const diffEl = document.getElementById('stat-today-diff');
                if (diff > 0) {
                    diffEl.textContent = `+${diff}`;
                    diffEl.style.color = '#27ae60';
                } else if (diff < 0) {
                    diffEl.textContent = `${diff}`;
                    diffEl.style.color = '#e74c3c';
                } else {
                    diffEl.textContent = '0';
                    diffEl.style.color = '#888';
                }

            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // 회원 목록: users 컬렉션만으로 즉시 렌더한 뒤, 각 포트폴리오의
        // "이름/마지막 수정"은 병렬(타임아웃 포함)로 뒤늦게 채운다.
        // (예전엔 회원 수만큼 getDoc을 순차로 돌려서, 읽기 하나가 멈추면
        //  목록 전체가 "로딩 중"에서 영영 멈췄다.)
        async function loadMembers() {
            try {
                const usersSnap = await getDocs(collection(db, 'users'));
                const members = usersSnap.docs.map(d => {
                    const u = d.data();
                    return {
                        id: d.id,
                        email: u.email || '-',
                        name: u.displayName || (u.email ? u.email.split('@')[0] : '이름 없음'),
                        createdAt: u.createdAt || null,
                        lastLogin: u.lastLogin || null,
                        updatedAt: null,
                        portfolioId: u.portfolioId || d.id
                    };
                });

                // 최근 접속 순 정렬
                members.sort((a, b) => {
                    if (!a.lastLogin) return 1;
                    if (!b.lastLogin) return -1;
                    return new Date(b.lastLogin) - new Date(a.lastLogin);
                });

                // 1) 즉시 렌더 (포트폴리오 읽기를 기다리지 않는다)
                renderMemberTable(members);

                // 2) 포트폴리오 정보(이름/마지막 수정)를 병렬로 보강
                enrichMembers(members);
            } catch (error) {
                console.error('Error loading members:', error);
                document.getElementById('member-list').innerHTML = '<p style="color: #e74c3c;">회원 목록을 불러오는데 실패했습니다.</p>';
            }
        }

        // 한 문서 읽기에 타임아웃을 걸어, 멈춘 읽기가 목록을 막지 않게 한다.
        function readPortfolioWithTimeout(uid, ms = 6000) {
            return Promise.race([
                getDoc(doc(db, 'portfolios', uid)).then(s => s.exists() ? s.data() : null).catch(() => null),
                new Promise(resolve => setTimeout(() => resolve(null), ms))
            ]);
        }

        async function enrichMembers(members) {
            await Promise.allSettled(members.map(async (m) => {
                const p = await readPortfolioWithTimeout(m.id);
                const row = document.querySelector(`tr[data-uid="${m.id}"]`);
                if (!row) return;
                if (!p) {
                    // 읽기 실패/타임아웃 — "마지막 수정"은 알 수 없음으로 표시
                    const upEl = row.querySelector('.member-updated');
                    if (upEl) upEl.textContent = '-';
                    return;
                }
                const realName = p.profile && p.profile.name;
                if (realName) {
                    m.name = realName;
                    const nameEl = row.querySelector('.member-name');
                    const avatarEl = row.querySelector('.member-avatar');
                    if (nameEl) nameEl.textContent = realName;
                    if (avatarEl) avatarEl.textContent = realName.charAt(0);
                }
                if (p.updatedAt) {
                    const upEl = row.querySelector('.member-updated');
                    if (upEl) upEl.textContent = formatDate(p.updatedAt);
                }
            }));
        }

        function renderMemberTable(members) {
            if (members.length === 0) {
                document.getElementById('member-list').innerHTML = '<p style="color: #888;">등록된 회원이 없습니다.</p>';
                return;
            }

            const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
            const html = `
                <table class="member-table">
                    <thead>
                        <tr>
                            <th style="width:34px;"><input type="checkbox" id="sel-all" onchange="toggleAll(this)" title="전체 선택"></th>
                            <th>회원</th>
                            <th>이메일</th>
                            <th>가입일</th>
                            <th>최근 접속</th>
                            <th>마지막 수정</th>
                            <th>액션</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${members.map(m => {
                            const isAdmin = SUPER_ADMIN_EMAILS.includes(m.email);
                            return `
                            <tr data-uid="${m.id}">
                                <td style="text-align:center;">
                                    ${isAdmin
                                        ? '<span title="관리자 계정 — 삭제 불가" style="color:#666;">🔒</span>'
                                        : `<input type="checkbox" class="row-check" data-uid="${m.id}" data-email="${esc(m.email)}" data-name="${esc(m.name)}" onchange="updateSelCount()">`}
                                </td>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 10px;">
                                        <div class="member-avatar">${m.name.charAt(0)}</div>
                                        <span class="member-name">${esc(m.name)}</span>
                                    </div>
                                </td>
                                <td class="member-email">${esc(m.email)}</td>
                                <td>${formatDate(m.createdAt)}</td>
                                <td>${formatDate(m.lastLogin)}</td>
                                <td class="member-updated">…</td>
                                <td style="white-space:nowrap;">
                                    <button class="preview-btn" onclick="openPreview('${m.id}', '${(m.name || '').replace(/'/g, "\\'")}')">👁 보기</button>
                                    <button class="edit-btn" onclick="openEdit('${m.id}')">✏️ 편집</button>
                                </td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('member-list').innerHTML = html;
            updateSelCount();
        }

        async function loadRecentActivity() {
            try {
                const activityRef = collection(db, 'activity_logs');
                const q = query(activityRef, orderBy('timestamp', 'desc'), limit(20));
                const activitySnap = await getDocs(q);

                const activities = [];
                activitySnap.forEach(doc => {
                    activities.push({ id: doc.id, ...doc.data() });
                });

                renderActivityList(activities);

            } catch (error) {
                console.error('Error loading activity:', error);
                document.getElementById('activity-list').innerHTML = '<p style="color: #888;">활동 로그가 없습니다.</p>';
            }
        }

        function renderActivityList(activities) {
            if (activities.length === 0) {
                document.getElementById('activity-list').innerHTML = '<p style="color: #888;">최근 활동이 없습니다.</p>';
                return;
            }

            const icons = {
                'visit': '👁️',
                'login': '🔐',
                'save': '💾',
                'pdf': '📄',
                'signup': '✨'
            };

            const html = activities.map(a => `
                <div class="activity-item">
                    <div class="activity-icon">${icons[a.type] || '📌'}</div>
                    <div class="activity-content">
                        <div class="activity-text">${a.message || a.type}</div>
                        <div class="activity-time">${formatDateTime(a.timestamp)}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('activity-list').innerHTML = html;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Make functions globally available
        let currentPreviewUid = null;

        window.openPreview = function(uid, name) {
            const modal = document.getElementById('preview-modal');
            const frame = document.getElementById('preview-frame');
            const title = document.getElementById('preview-modal-title');

            currentPreviewUid = uid;
            title.textContent = `${name}님의 포트폴리오 미리보기`;
            frame.src = `portfolio.html?u=${uid}`;
            modal.classList.add('active');
        };

        // 목록/미리보기에서 "편집" → 그 회원의 편집 화면을 새 탭으로 연다.
        window.openEdit = function(uid) {
            window.open(`portfolio-edit.html?u=${encodeURIComponent(uid)}`, '_blank', 'noopener');
        };

        // 미리보기 모달 헤더의 "편집하기" 버튼
        window.openEditFromPreview = function() {
            if (currentPreviewUid) window.openEdit(currentPreviewUid);
        };

        window.closePreview = function() {
            const modal = document.getElementById('preview-modal');
            const frame = document.getElementById('preview-frame');
            modal.classList.remove('active');
            frame.src = '';
            currentPreviewUid = null;
        };

        window.refreshMembers = function() {
            document.getElementById('member-list').innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>회원 목록 로딩 중...</p>
                </div>
            `;
            loadMembers();
        };

        // ===== 선택 삭제 / 백업 =====
        window.toggleAll = function(master) {
            document.querySelectorAll('.row-check').forEach(c => { c.checked = master.checked; });
            updateSelCount();
        };

        window.updateSelCount = function() {
            const n = document.querySelectorAll('.row-check:checked').length;
            const el = document.getElementById('sel-count');
            if (el) el.textContent = n;
            const all = document.getElementById('sel-all');
            const total = document.querySelectorAll('.row-check').length;
            if (all) all.checked = total > 0 && n === total;
        };

        // 삭제 전 전체 백업을 JSON으로 내려받는다 (복구용). 잼 방지로 배치 읽기.
        window.backupAll = async function(btn) {
            const orig = btn ? btn.textContent : '';
            if (btn) { btn.disabled = true; btn.textContent = '백업 중…'; }
            try {
                const usersSnap = await getDocs(collection(db, 'users'));
                const users = {}; usersSnap.forEach(d => users[d.id] = d.data());
                const portfolios = {};
                const ids = Object.keys(users);
                for (let i = 0; i < ids.length; i += 3) {
                    await Promise.all(ids.slice(i, i + 3).map(async id => {
                        try { const s = await getDoc(doc(db, 'portfolios', id)); if (s.exists()) portfolios[id] = s.data(); }
                        catch (e) { console.warn('backup fail', id, e.code); }
                    }));
                }
                const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), users, portfolios })], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'portfolio-backup-' + new Date().toISOString().slice(0, 10) + '.json';
                a.click();
                alert('백업 완료: 포트폴리오 ' + Object.keys(portfolios).length + '개, 회원 ' + ids.length + '명\n다운로드 폴더를 확인하세요.');
            } catch (e) {
                alert('백업 실패: ' + (e.code || e.message));
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = orig; }
            }
        };

        window.deleteSelected = async function() {
            const checks = Array.from(document.querySelectorAll('.row-check:checked'));
            if (!checks.length) { alert('삭제할 회원을 체크해주세요.'); return; }

            const targets = checks.map(c => ({ uid: c.dataset.uid, email: c.dataset.email, name: c.dataset.name }))
                // 안전장치: 관리자 계정은 절대 제외
                .filter(t => !SUPER_ADMIN_EMAILS.includes(t.email));
            if (!targets.length) { alert('관리자 계정은 삭제할 수 없습니다.'); return; }

            const names = targets.map(t => `· ${t.name || '(무명)'} (${t.email})`).join('\n');
            if (!confirm('⚠ 되돌릴 수 없습니다.\n\n먼저 "💾 백업 다운로드"로 백업을 받으셨나요?\n\n다음 ' + targets.length + '명의 포트폴리오와 회원 정보를 삭제합니다:\n\n' + names + '\n\n정말 삭제할까요?')) return;
            if (!confirm('마지막 확인: ' + targets.length + '명을 영구 삭제합니다. 계속하시겠어요?')) return;

            let ok = 0, fail = 0; const errs = [];
            for (const t of targets) {
                try {
                    await deleteDoc(doc(db, 'portfolios', t.uid));
                    await deleteDoc(doc(db, 'users', t.uid));
                    ok++;
                    const row = document.querySelector(`tr[data-uid="${t.uid}"]`);
                    if (row) row.remove();
                } catch (e) {
                    fail++; errs.push(t.email + ': ' + (e.code || e.message));
                }
                await new Promise(r => setTimeout(r, 150));
            }
            updateSelCount();
            let msg = '삭제 완료: ' + ok + '명';
            if (fail) msg += '\n실패: ' + fail + '명\n' + errs.join('\n') +
                '\n\n(권한 오류라면 Firestore 규칙에서 관리자 삭제 허용이 필요합니다.)';
            msg += '\n\n※ 이미지 파일(Storage)은 삭제되지 않습니다.';
            alert(msg);
            // 통계(총 회원 수 등) 갱신
            loadStats();
        };

        // Initialize
        init();
    </script>
</body>
</html>
