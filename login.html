<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Portfolio Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 4px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .auth-tab.active {
            background: #3498db;
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #3498db;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-google {
            background: white;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-google:hover {
            background: #f5f5f5;
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 12px;
        }

        .error-message {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.5);
            color: #e74c3c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid rgba(46, 204, 113, 0.5);
            color: #2ecc71;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .auth-footer a {
            color: #3498db;
            text-decoration: none;
        }

        .loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .loading .btn-primary::after {
            content: '...';
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">📁</div>
                <h1 class="auth-title">Portfolio Platform</h1>
                <p class="auth-subtitle">나만의 포트폴리오를 만들어보세요</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">로그인</button>
                <button class="auth-tab" data-tab="signup">회원가입</button>
            </div>

            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>

            <!-- Login Form -->
            <form class="auth-form active" id="login-form">
                <div class="form-group">
                    <label class="form-label">이메일</label>
                    <input type="email" class="form-input" id="login-email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">비밀번호</label>
                    <input type="password" class="form-input" id="login-password" placeholder="비밀번호 입력" required>
                </div>
                <button type="submit" class="btn btn-primary">로그인</button>

                <div class="divider"><span>또는</span></div>

                <button type="button" class="btn btn-google" id="google-login">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Google로 계속하기
                </button>
            </form>

            <!-- Signup Form -->
            <form class="auth-form" id="signup-form">
                <div class="form-group">
                    <label class="form-label">이름 (닉네임)</label>
                    <input type="text" class="form-input" id="signup-name" placeholder="홍길동" required>
                </div>
                <div class="form-group">
                    <label class="form-label">이메일</label>
                    <input type="email" class="form-input" id="signup-email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">비밀번호</label>
                    <input type="password" class="form-input" id="signup-password" placeholder="6자 이상 입력" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">비밀번호 확인</label>
                    <input type="password" class="form-input" id="signup-password-confirm" placeholder="비밀번호 다시 입력" required>
                </div>
                <button type="submit" class="btn btn-primary">회원가입</button>

                <div class="divider"><span>또는</span></div>

                <button type="button" class="btn btn-google" id="google-signup">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Google로 가입하기
                </button>
            </form>

            <div class="auth-footer">
                <p>로그인하면 <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의하게 됩니다.</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { AuthManager } from './js/firebase-config.js';

        // Wait for auth to initialize
        await AuthManager.init();

        // If already logged in, redirect to portfolio
        if (AuthManager.isLoggedIn()) {
            window.location.href = 'portfolio.html';
        }

        // Tab switching
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;

                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(`${tabName}-form`).classList.add('active');

                hideMessages();
            });
        });

        // Login form
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            e.target.classList.add('loading');

            const result = await AuthManager.signIn(email, password);

            e.target.classList.remove('loading');

            if (result.success) {
                showSuccess('로그인 성공! 포트폴리오로 이동합니다...');
                setTimeout(() => {
                    window.location.href = 'portfolio.html';
                }, 1000);
            } else {
                showError(getErrorMessage(result.error));
            }
        });

        // Signup form
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const passwordConfirm = document.getElementById('signup-password-confirm').value;

            if (password !== passwordConfirm) {
                showError('비밀번호가 일치하지 않습니다.');
                return;
            }

            e.target.classList.add('loading');

            const result = await AuthManager.signUp(email, password, name);

            e.target.classList.remove('loading');

            if (result.success) {
                showSuccess('회원가입 성공! 포트폴리오로 이동합니다...');
                setTimeout(() => {
                    window.location.href = 'portfolio.html';
                }, 1000);
            } else {
                showError(getErrorMessage(result.error));
            }
        });

        // Google login
        document.getElementById('google-login').addEventListener('click', handleGoogleAuth);
        document.getElementById('google-signup').addEventListener('click', handleGoogleAuth);

        async function handleGoogleAuth() {
            hideMessages();

            const result = await AuthManager.signInWithGoogle();

            if (result.success) {
                showSuccess('로그인 성공! 포트폴리오로 이동합니다...');
                setTimeout(() => {
                    window.location.href = 'portfolio.html';
                }, 1000);
            } else {
                showError(getErrorMessage(result.error));
            }
        }

        function showError(message) {
            const el = document.getElementById('error-message');
            el.textContent = message;
            el.classList.add('show');
        }

        function showSuccess(message) {
            const el = document.getElementById('success-message');
            el.textContent = message;
            el.classList.add('show');
        }

        function hideMessages() {
            document.getElementById('error-message').classList.remove('show');
            document.getElementById('success-message').classList.remove('show');
        }

        function getErrorMessage(error) {
            if (error.includes('email-already-in-use')) return '이미 사용 중인 이메일입니다.';
            if (error.includes('invalid-email')) return '올바른 이메일 형식이 아닙니다.';
            if (error.includes('weak-password')) return '비밀번호가 너무 짧습니다. (최소 6자)';
            if (error.includes('user-not-found')) return '등록되지 않은 이메일입니다.';
            if (error.includes('wrong-password')) return '비밀번호가 일치하지 않습니다.';
            if (error.includes('invalid-credential')) return '이메일 또는 비밀번호가 올바르지 않습니다.';
            if (error.includes('too-many-requests')) return '너무 많은 시도가 있었습니다. 잠시 후 다시 시도해주세요.';
            return error;
        }
    </script>
</body>
</html>
